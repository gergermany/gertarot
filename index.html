<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三牌陣塔羅占卜 | Art Nouveau Tarot</title>
<style>
  /* 藝術新藝運風格基礎設計 */
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital@0;1&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body { 
    font-family: 'Lora', 'Georgia', serif; 
    text-align: center; 
    background: linear-gradient(135deg, #f5e6d3 0%, #e8d5c4 50%, #f0dcc8 100%);
    color: #4a3728;
    padding: 40px 20px 60px 20px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景裝飾圖案 */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      radial-gradient(circle at 20% 50%, rgba(184, 134, 11, 0.03) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(139, 69, 19, 0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: -1;
  }

  h1 { 
    color: #8b4513;
    font-family: 'Cinzel', serif;
    font-size: 3em;
    font-weight: 700;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    letter-spacing: 3px;
  }

  p {
    color: #6b5344;
    font-size: 1.1em;
    font-style: italic;
    margin-bottom: 25px;
    font-family: 'Lora', serif;
  }

  /* 牌陣容器 */
  .spread-container {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin: 50px auto;
    flex-wrap: wrap;
    padding: 40px;
    min-height: 450px;
  }

  .card-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }

  .position-label {
    margin-bottom: 20px;
    font-size: 1.3em;
    font-weight: bold;
    color: #8b4513;
    letter-spacing: 2px;
    font-family: 'Cinzel', serif;
    text-transform: uppercase;
  }

  /* 塔羅牌容器與翻轉效果 */
  .card-container { 
    width: 160px;
    height: 270px;
    perspective: 1000px;
    cursor: pointer;
  }
  
  .card { 
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
    position: relative;
    box-shadow: 0 8px 20px rgba(139, 69, 19, 0.3);
    border-radius: 8px;
  }
  
  .card.flipped { 
    transform: rotateY(180deg);
  }

  .card-face { 
    width: 100%;
    height: 100%;
    position: absolute;
    backface-visibility: hidden;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border: 3px solid #c9a961;
    overflow: hidden;
  }
  
  .card-front { 
    background: linear-gradient(135deg, #d4af37 0%, #c9a961 50%, #d4af37 100%);
    color: #5d4e37;
    background-image: 
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.1) 0px, rgba(255, 255, 255, 0.1) 10px, transparent 10px, transparent 20px),
      repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.05) 0px, rgba(0, 0, 0, 0.05) 10px, transparent 10px, transparent 20px);
    position: relative;
    font-weight: bold;
    font-size: 3em;
  }

  .card-front::before,
  .card-front::after {
    content: '✦';
    position: absolute;
    color: #8b4513;
    opacity: 0.5;
    font-size: 1.5em;
  }

  .card-front::before {
    top: 10px;
    left: 10px;
  }

  .card-front::after {
    bottom: 10px;
    right: 10px;
  }

  .card-back { 
    background: linear-gradient(135deg, #f5e6d3 0%, #ede0d5 50%, #f5e6d3 100%);
    color: #4a3728;
    transform: rotateY(180deg);
    flex-direction: column;
    padding: 12px;
    box-sizing: border-box;
    text-align: center;
    border: 3px solid #c9a961;
  }

  .card-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 5px;
  }
  
  /* 按鈕設計 */
  button { 
    background: linear-gradient(135deg, #8b4513 0%, #a0522d 50%, #8b4513 100%);
    color: #f5e6d3;
    border: 2px solid #c9a961;
    padding: 15px 40px;
    font-size: 1.1em;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: bold;
    font-family: 'Cinzel', serif;
    margin-bottom: 15px;
    letter-spacing: 1px;
    box-shadow: 0 4px 12px rgba(139, 69, 19, 0.3);
    text-transform: uppercase;
  }

  button:hover { 
    background: linear-gradient(135deg, #a0522d 0%, #8b4513 50%, #a0522d 100%);
    box-shadow: 0 6px 16px rgba(139, 69, 19, 0.5);
    transform: translateY(-2px);
  }

  button:disabled { 
    background: #c4b5a0;
    color: #8b7d6b;
    cursor: not-allowed;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    border-color: #a89880;
  }

  /* 結果文字 */
  #result-text { 
    margin-top: 60px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.8;
    font-size: 1em;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(201, 169, 97, 0.1) 100%);
    padding: 30px;
    border-radius: 8px;
    display: none;
    text-align: left;
    border: 2px solid #c9a961;
    color: #4a3728;
  }
  
  .result-section {
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(201, 169, 97, 0.4);
  }

  .result-section:last-child { 
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .result-title { 
    color: #8b4513;
    font-weight: bold;
    font-size: 1.1em;
    font-family: 'Cinzel', serif;
    display: block;
    margin-bottom: 8px;
  }

  /* 響應式設計 */
  @media (max-width: 768px) {
    h1 { font-size: 2em; }
    .spread-container { gap: 30px; padding: 20px; }
    .card-container { width: 130px; height: 220px; }
  }
</style>
</head>
<body>

<h1>✦ 過去 · 現在 · 未來 ✦</h1>
<p>靜心默念您的問題，然後點擊下方按鈕</p>
<button id="drawBtn" onclick="drawCards()">為我抽三張牌</button>

<div class="spread-container">
  <!-- 過去 -->
  <div class="card-wrapper">
    <div class="position-label">【過去】</div>
    <div class="card-container">
      <div class="card" id="card-past">
        <div class="card-face card-front">🔮</div>
        <div class="card-face card-back" id="back-past">
          <img class="card-image" id="img-past" src="" alt="card">
        </div>
      </div>
    </div>
  </div>

  <!-- 現在 -->
  <div class="card-wrapper">
    <div class="position-label">【現在】</div>
    <div class="card-container">
      <div class="card" id="card-present">
        <div class="card-face card-front">🔮</div>
        <div class="card-face card-back" id="back-present">
          <img class="card-image" id="img-present" src="" alt="card">
        </div>
      </div>
    </div>
  </div>

  <!-- 未來 -->
  <div class="card-wrapper">
    <div class="position-label">【未來】</div>
    <div class="card-container">
      <div class="card" id="card-future">
        <div class="card-face card-front">🔮</div>
        <div class="card-face card-back" id="back-future">
          <img class="card-image" id="img-future" src="" alt="card">
        </div>
      </div>
    </div>
  </div>
</div>

<div id="result-text"></div>

const positions = ['past', 'present', 'future'];
const positionLabels = ['過去 (影響現狀的原因)', '現在 (目前的處境)', '未來 (發展的趨勢)'];

function drawCards() {
  const drawBtn = document.getElementById('drawBtn');
  const resultTextEl = document.getElementById('result-text');
  
  drawBtn.disabled = true;

  let cardsAlreadyFlipped = false;
  positions.forEach(pos => {
    const cardEl = document.getElementById(`card-${pos}`);
    if (cardEl.classList.contains('flipped')) {
      cardEl.classList.remove('flipped');
      cardsAlreadyFlipped = true;
    }
  });

  resultTextEl.style.display = 'none';

  if (cardsAlreadyFlipped) {
    setTimeout(performDraw, 800);
  } else {
    performDraw();
  }

  function performDraw() {
    let availableDeck = [...tarotDeck];
    let resultsHTML = '';

    for (let i = 0; i < 3; i++) {
      const randomIndex = Math.floor(Math.random() * availableDeck.length);
      const selectedCard = availableDeck[randomIndex];
      
      availableDeck.splice(randomIndex, 1);
      
      const isReversed = Math.random() > 0.5;
      const pos = positions[i];
      
      // Update image
      const imgEl = document.getElementById(`img-${pos}`);
      imgEl.src = selectedCard.image;
      imgEl.alt = selectedCard.name;
      
      const backEl = document.getElementById(`back-${pos}`);
      
      let interpretation = "";

      if (isReversed) {
        backEl.style.transform = "rotateY(180deg) rotateZ(180deg)";
        interpretation = selectedCard.reversed;
      } else {
        backEl.style.transform = "rotateY(180deg) rotateZ(0deg)";
        interpretation = selectedCard.upright;
      }

      resultsHTML += `
        <div class="result-section">
          <span class="result-title">${positionLabels[i]}：</span> 
          ${selectedCard.name} ${isReversed ? '<span style="color:#a0522d">(逆位)</span>' : '<span style="color:#8b4513">(正位)</span>'}<br>
          ${interpretation}
        </div>
      `;

      setTimeout(() => {
        document.getElementById(`card-${pos}`).classList.add('flipped');
      }, 100 + (i * 500));
    }

    resultTextEl.innerHTML = resultsHTML;
    
    setTimeout(() => {
      resultTextEl.style.display = 'block';
      drawBtn.disabled = false;
    }, 1800);
  }
}
