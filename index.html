<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三牌陣塔羅占卜 | Art Nouveau Tarot</title>
<style>
  /* Art Nouveau 風格基礎設計 */
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body { 
    font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif; 
    text-align: center; 
    background: linear-gradient(135deg, #A8C7BB 0%, #EEC8E0 50%, #A8C7BB 100%);
    color: #392F5A;
    padding: 40px 20px 60px 20px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景裝飾圖案 */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      radial-gradient(circle at 20% 50%, rgba(238, 200, 224, 0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(57, 47, 90, 0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: -1;
  }

  h1 { 
    color: #392F5A;
    font-family: 'Montserrat', sans-serif;
    font-size: 3em;
    font-weight: 700;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    letter-spacing: 3px;
  }

  p {
    color: #392F5A;
    font-size: 1.1em;
    font-style: italic;
    margin-bottom: 25px;
    font-family: 'Open Sans', sans-serif;
  }

  /* 牌陣容器 - 固定高度防止位移 */
  .spread-container {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin: 50px auto;
    flex-wrap: wrap;
    padding: 40px;
    height: 420px;
    align-items: flex-start;
  }

  .card-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
    height: 100%;
  }

  .position-label {
    margin-bottom: 20px;
    font-size: 1.3em;
    font-weight: bold;
    color: #392F5A;
    letter-spacing: 2px;
    font-family: 'Montserrat', sans-serif;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* 塔羅牌容器與翻轉效果 */
  .card-container { 
    width: 160px;
    height: 270px;
    perspective: 1000px;
    cursor: pointer;
    flex-shrink: 0;
  }
  
  .card { 
    width: 100%;
    height: 100%;
    transition: transform 0.8s;
    transform-style: preserve-3d;
    position: relative;
    box-shadow: 0 8px 20px rgba(57, 47, 90, 0.3);
    border-radius: 8px;
  }
  
  .card.flipped { 
    transform: rotateY(180deg);
  }

  .card-face { 
    width: 100%;
    height: 100%;
    position: absolute;
    backface-visibility: hidden;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border: 3px solid #A8C7BB;
    overflow: hidden;
  }
  
  .card-front { 
    background: linear-gradient(135deg, #EEC8E0 0%, #A8C7BB 50%, #EEC8E0 100%);
    color: #392F5A;
    background-image: 
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.1) 0px, rgba(255, 255, 255, 0.1) 10px, transparent 10px, transparent 20px),
      repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.05) 0px, rgba(0, 0, 0, 0.05) 10px, transparent 10px, transparent 20px);
    position: relative;
    font-weight: bold;
    font-size: 3em;
  }

  .card-front::before,
  .card-front::after {
    content: '✦';
    position: absolute;
    color: #392F5A;
    opacity: 0.5;
    font-size: 1.5em;
  }

  .card-front::before {
    top: 10px;
    left: 10px;
  }

  .card-front::after {
    bottom: 10px;
    right: 10px;
  }

  .card-back { 
    background: linear-gradient(135deg, #A8C7BB 0%, #EEC8E0 50%, #A8C7BB 100%);
    color: #392F5A;
    transform: rotateY(180deg);
    flex-direction: column;
    padding: 10px;
    box-sizing: border-box;
    text-align: center;
    border: 3px solid #A8C7BB;
    position: relative;
    font-size: 13px;
  }

  .card-back h3 {
    margin: 5px 0;
    font-size: 11px;
    font-family: 'Montserrat', sans-serif;
    color: #392F5A;
    font-weight: 600;
    line-height: 1.1;
  }

  .card-back p {
    font-size: 10px;
    font-weight: normal;
    margin: 0;
    color: #392F5A;
    font-style: normal;
    line-height: 1.2;
  }
  
  /* 按鈕設計 */
  button { 
    background: linear-gradient(135deg, #A8C7BB 0%, #EEC8E0 50%, #A8C7BB 100%);
    color: #392F5A;
    border: 2px solid #392F5A;
    padding: 15px 40px;
    font-size: 1.1em;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: bold;
    font-family: 'Montserrat', sans-serif;
    margin-bottom: 15px;
    letter-spacing: 1px;
    box-shadow: 0 4px 12px rgba(57, 47, 90, 0.3);
    text-transform: uppercase;
  }

  button:hover { 
    background: linear-gradient(135deg, #EEC8E0 0%, #A8C7BB 50%, #EEC8E0 100%);
    box-shadow: 0 6px 16px rgba(57, 47, 90, 0.5);
    transform: translateY(-2px);
  }

  button:disabled { 
    background: #D4D4D4;
    color: #999;
    cursor: not-allowed;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    border-color: #999;
  }

  /* 結果文字 */
  #result-text { 
    margin-top: 60px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.8;
    font-size: 1em;
    background: linear-gradient(135deg, rgba(168, 199, 187, 0.15) 0%, rgba(238, 200, 224, 0.1) 100%);
    padding: 30px;
    border-radius: 8px;
    display: none;
    text-align: left;
    border: 2px solid #A8C7BB;
    color: #392F5A;
    font-family: 'Open Sans', sans-serif;
  }
  
  .result-section {
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(57, 47, 90, 0.2);
  }

  .result-section:last-child { 
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .result-title { 
    color: #392F5A;
    font-weight: bold;
    font-size: 1.1em;
    font-family: 'Montserrat', sans-serif;
    display: block;
    margin-bottom: 8px;
  }

  /* 響應式設計 */
  @media (max-width: 768px) {
    h1 { font-size: 2em; }
    .spread-container { gap: 30px; padding: 20px; height: auto; }
    .card-container { width: 130px; height: 220px; }
  }
</style>
</head>
<body>

<h1>✦ 過去 · 現在 · 未來 ✦</h1>
<p>靜心默念您的問題，然後點擊下方按鈕</p>
<button id="drawBtn" onclick="drawCards()">為我抽三張牌</button>

<div class="spread-container">
  <!-- 過去 -->
  <div class="card-wrapper">
    <div class="position-label">【過去】</div>
    <div class="card-container">
      <div class="card" id="card-past">
        <div class="card-face card-front">🔮</div>

    </div>
  </div>

  <!-- 現在 -->
  <div class="card-wrapper">

        <div class="card-face card-back" id="back-present">
          <h3 id="name-present"></h3>
          <p id="orientation-present"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 未來 -->

      <div class="card" id="card-future">

      </div>
    </div>
  </div>
</div>

<div id="result-text"></div>

const positions = ['past', 'present', 'future'];
const positionLabels = ['過去 (影響現狀的原因)', '現在 (目前的處境)', '未來 (發展的趨勢)'];

function drawCards() {
  const drawBtn = document.getElementById('drawBtn');
  const resultTextEl = document.getElementById('result-text');
  
  drawBtn.disabled = true;

  let cardsAlreadyFlipped = false;
  positions.forEach(pos => {
    const cardEl = document.getElementById(`card-${pos}`);
    if (cardEl.classList.contains('flipped')) {
      cardEl.classList.remove('flipped');
      cardsAlreadyFlipped = true;
    }
  });

  resultTextEl.style.display = 'none';

  if (cardsAlreadyFlipped) {
    setTimeout(performDraw, 800);
  } else {
    performDraw();
  }

    let availableDeck = [...tarotDeck];
    let resultsHTML = '';

    for (let i = 0; i < 3; i++) {
      const randomIndex = Math.floor(Math.random() * availableDeck.length);
      const selectedCard = availableDeck[randomIndex];
      
      availableDeck.splice(randomIndex, 1);
      
      const isReversed = Math.random() > 0.5;
      const pos = positions[i];
      
      // Update card display
      const nameEl = document.getElementById(`name-${pos}`);
      const orientationEl = document.getElementById(`orientation-${pos}`);
      
      nameEl.innerText = selectedCard.name;
      
      let interpretation = "";

      if (isReversed) {
        orientationEl.innerText = "(逆位)";
        orientationEl.style.color = "#F092DD";
        interpretation = selectedCard.reversed;
      } else {
        orientationEl.innerText = "(正位)";
        orientationEl.style.color = "#EEC8E0";
        interpretation = selectedCard.upright;
      }

      resultsHTML += `
        <div class="result-section">
          <span class="result-title">${positionLabels[i]}：</span> 
          ${selectedCard.name} ${isReversed ? '<span style="color:#F092DD">(逆位)</span>' : '<span style="color:#EEC8E0">(正位)</span>'}<br>
          ${interpretation}
        </div>
      `;

      setTimeout(() => {
        document.getElementById(`card-${pos}`).classList.add('flipped');
      }, 100 + (i * 500));
    }

    resultTextEl.innerHTML = resultsHTML;
    
    setTimeout(() => {
      resultTextEl.style.display = 'block';
      drawBtn.disabled = false;
    }, 1800);
  }
}
</script>

</body>
</html>
